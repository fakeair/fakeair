# 静态站点部署配置（Netlify 用；没有 Node 依赖，不需要构建）
# 上传整个文件夹即可，或连接 Git 仓库自动部署。

[build]
  publish = "."

# 图片体积大、内容不变，长缓存；页面不缓存，改完立刻生效
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# 自定义 404 直接用首页
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
